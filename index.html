<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>221B BAKER STREET - CONFIDENTIAL CASE DOSSIER</title>

  <!-- TensorFlow.js & Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+KR:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --parchment: #e2d2b4;
      --parchment-dark: #ccb793;
      --ink: #1a1412;
      --wax-red: #8b0000;
      --gold-accent: #b89742;
      --shadow: rgba(0, 0, 0, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Serif KR', serif;
      background-color: #0d0a08;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(20, 15, 12, 0.85), rgba(5, 3, 2, 0.98)),
        url('https://www.transparenttextures.com/patterns/dark-wood.png');
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 사건 양피지 문서 스타일 */
    .dossier-container {
      width: 100%;
      max-width: 520px;
      background-color: var(--parchment);
      background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
      border: 12px solid #281d17;
      border-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png') 30 round;
      box-shadow: 0 20px 50px var(--shadow), 0 0 15px rgba(184, 151, 66, 0.2);
      padding: 30px 24px;
      position: relative;
      border-radius: 4px;
    }

    /* 문서 금빛 이중 프레임 */
    .dossier-container::before {
      content: '';
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      border: 2px solid var(--gold-accent);
      pointer-events: none;
    }

    /* 헤더 */
    .dossier-header {
      text-align: center;
      border-bottom: 2px double var(--ink);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .dossier-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--wax-red);
    }

    .dossier-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--ink);
      margin: 4px 0;
    }

    /* 스텝 관리를 위한 페이지 컨트롤 */
    .page {
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 4px;
      color: var(--ink);
      display: flex;
      justify-content: space-between;
    }

    /* 양식 라벨 & 입력 필드 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #2c2018;
    }

    input[type="text"], select, textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.4);
      border: none;
      border-bottom: 2px solid var(--ink);
      padding: 8px;
      font-family: 'Noto Serif KR', serif;
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      background: rgba(255, 255, 255, 0.7);
      border-bottom-color: var(--wax-red);
    }

    textarea {
      resize: none;
      border: 1px solid var(--ink);
      background: rgba(255, 255, 255, 0.3);
      height: 70px;
    }

    /* 서명 캔버스 */
    .signature-pad {
      width: 100%;
      height: 100px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px dashed var(--ink);
      cursor: crosshair;
      touch-action: none;
    }

    .signature-tools {
      display: flex;
      justify-content: flex-end;
    }

    .btn-clear {
      background: none;
      border: none;
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      color: var(--wax-red);
    }

    /* 실링 왁스 도장 영역 */
    .wax-seal-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .wax-seal-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #a81313, var(--wax-red), #4a0000);
      box-shadow: 0 6px 12px var(--shadow);
      border: 3px solid #6b0000;
      color: var(--gold-accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .wax-seal-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px var(--shadow);
    }

    .wax-seal-btn.stamped {
      background: radial-gradient(circle at 30% 30%, #520000, #2b0000);
      border-color: var(--gold-accent);
      transform: scale(0.95);
    }

    .wax-seal-btn i {
      font-size: 1.8rem;
    }

    /* 탐정풍 버튼 */
    .btn-nav {
      background: #281d17;
      color: var(--parchment);
      border: 1px solid var(--gold-accent);
      padding: 12px 20px;
      font-family: 'Cinzel', 'Noto Serif KR', serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-nav:hover {
      background: var(--wax-red);
      color: #fff;
    }

    /* 웹캠 및 결과창 */
    .webcam-box {
      width: 240px;
      height: 240px;
      margin: 0 auto;
      border: 4px solid var(--ink);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .webcam-box canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    .verdict-box {
      border: 2px double var(--wax-red);
      background: rgba(255, 255, 255, 0.4);
      padding: 12px;
      text-align: center;
    }

    .verdict-title {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: var(--wax-red);
    }

    .verdict-value {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 4px 0;
    }

    .progress-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.8rem;
    }

    .progress-bar {
      height: 6px;
      background: #bbab91;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--wax-red);
      width: 0%;
      transition: width 0.2s;
    }

    .error-text {
      color: var(--wax-red);
      font-size: 0.78rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="dossier-container">
    <header class="dossier-header">
      <h2>221B BAKER STREET DOSSIER</h2>
      <h1>PROJECT TISSUE</h1>
      <p style="font-size: 0.8rem; font-style: italic;">비밀 수사 의뢰 청원서</p>
    </header>

    <!-- PAGE 1: 의뢰인 신원 확인 -->
    <div class="page active" id="page-1">
      <div class="page-title">
        <span>I. 의뢰인 신원 정보</span>
        <span>01/04</span>
      </div>
      <div class="form-group">
        <label>소속 기관 (학교명)</label>
        <input type="text" id="school" value="한영외국어고등학교" readonly>
      </div>
      <div class="form-group">
        <label>의뢰인 학번 (필수)</label>
        <input type="text" id="student-id" placeholder="예: 30101">
      </div>
      <div class="form-group">
        <label>의뢰인 성명 (필수)</label>
        <input type="text" id="student-name" placeholder="의뢰인의 이름을 적으시오">
      </div>
      <p class="error-text" id="err-1">모든 신원 정보를 빠짐없이 작성해야 합니다.</p>
      <button class="btn-nav" onclick="nextPage(1)">다음 단서 기록 단계로 ▸</button>
    </div>

    <!-- PAGE 2: 사건 증거 및 용의선상 -->
    <div class="page" id="page-2">
      <div class="page-title">
        <span>II. 현장 상황 및 진술</span>
        <span>02/04</span>
      </div>
      <div class="form-group">
        <label>수사 대상 장소</label>
        <select id="location">
          <option value="본관 1층 화장실">본관 1층 화장실</option>
          <option value="본관 2층 화장실">본관 2층 화장실</option>
          <option value="신관 화장실">신관 화장실</option>
        </select>
      </div>
      <div class="form-group">
        <label>의심되는 증상 (필수)</label>
        <select id="symptom">
          <option value="">-- 증상을 선택하십시오 --</option>
          <option value="휴지심만 덩그러니 남음">휴지심만 덩그러니 남음</option>
          <option value="휴지가 얼마 남지 않아 잔여량 불분명">휴지가 얼마 남지 않아 잔여량 불분명</option>
          <option value="휴지 정기 점검 주기 도달">휴지 정기 점검 주기 도달</option>
        </select>
      </div>
      <div class="form-group">
        <label>탐정에게 전달할 사건 경위 (필수)</label>
        <textarea id="details" placeholder="현장 상황에 대해 상세히 진술하시오..."></textarea>
      </div>
      <p class="error-text" id="err-2">증상과 상세 사건 경위를 입력해야 합니다.</p>
      <button class="btn-nav" onclick="nextPage(2)">비밀 서약 및 서명으로 ▸</button>
    </div>

    <!-- PAGE 3: 서명 및 실링왁스 인장 -->
    <div class="page" id="page-3">
      <div class="page-title">
        <span>III. 기밀 서약 및 실링 인장</span>
        <span>03/04</span>
      </div>
      <div class="form-group">
        <label>의뢰인 친필 서명 (마우스/터치로 서명)</label>
        <canvas id="sig-canvas" class="signature-pad"></canvas>
        <div class="signature-tools">
          <button class="btn-clear" onclick="clearSignature()">서명 지우기</button>
        </div>
      </div>
      <div class="wax-seal-container">
        <label>밀봉용 실링왁스 인장 찍기 (클릭)</label>
        <div class="wax-seal-btn" id="wax-btn" onclick="stampWax()">
          <i class="fa-solid fa-stamp"></i>
        </div>
        <span id="wax-status" style="font-size: 0.75rem;">인장이 찍히지 않았습니다</span>
      </div>
      <p class="error-text" id="err-3">친필 서명과 실링왁스 인장이 모두 필요합니다.</p>
      <button class="btn-nav" onclick="startInvestigation()">셜록 홈즈에게 의뢰하기 (스캔 시작) ▸</button>
    </div>

    <!-- PAGE 4: 셜록 홈즈 실시간 AI 추론 스캔 -->
    <div class="page" id="page-4">
      <div class="page-title">
        <span>IV. 렌즈 추론 분석 중</span>
        <span>FINAL</span>
      </div>

      <div class="webcam-box" id="webcam-box">
        <span id="cam-placeholder" style="color:#aaa; font-size:0.8rem;">렌즈 초기화 중...</span>
      </div>

      <div class="verdict-box">
        <div class="verdict-title">- FINAL DEDUCTION -</div>
        <div class="verdict-value" id="top-verdict">-</div>
      </div>

      <div id="predictions-list" style="display:flex; flex-direction:column; gap:8px;"></div>

      <button class="btn-nav" style="background:#521212;" onclick="location.reload()">새 사건 의뢰하기</button>
    </div>
  </div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/FFJ6T1Fe1/";
    let isWaxStamped = false;
    let model, webcam, maxPredictions;

    // --- 서명 캔버스 구현 ---
    const sigCanvas = document.getElementById("sig-canvas");
    const ctx = sigCanvas.getContext("2d");
    let isSigning = false;
    let hasSignature = false;

    function resizeCanvas() {
      sigCanvas.width = sigCanvas.offsetWidth;
      sigCanvas.height = sigCanvas.offsetHeight;
      ctx.strokeStyle = "#1a1412";
      ctx.lineWidth = 2;
    }
    window.addEventListener("load", resizeCanvas);

    function getPos(e) {
      const rect = sigCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    sigCanvas.addEventListener("mousedown", (e) => { isSigning = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
    sigCanvas.addEventListener("mousemove", (e) => { if (!isSigning) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); hasSignature = true; });
    window.addEventListener("mouseup", () => { isSigning = false; });

    sigCanvas.addEventListener("touchstart", (e) => { isSigning = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
    sigCanvas.addEventListener("touchmove", (e) => { if (!isSigning) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); hasSignature = true; });
    window.addEventListener("touchend", () => { isSigning = false; });

    function clearSignature() {
      ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      hasSignature = false;
    }

    // --- 실링왁스 클릭 ---
    function stampWax() {
      const btn = document.getElementById("wax-btn");
      const status = document.getElementById("wax-status");
      isWaxStamped = true;
      btn.classList.add("stamped");
      btn.innerHTML = `<i class="fa-solid fa-crown"></i>`;
      status.innerText = "밀봉 완료 (221B SEAL)";
      status.style.color = "var(--wax-red)";
      status.style.fontWeight = "bold";
    }

    // --- 페이지 이동 및 검증 ---
    function nextPage(currentPage) {
      document.querySelectorAll(".error-text").forEach(e => e.style.display = "none");

      if (currentPage === 1) {
        const id = document.getElementById("student-id").value.trim();
        const name = document.getElementById("student-name").value.trim();
        if (!id || !name) {
          document.getElementById("err-1").style.display = "block";
          return;
        }
      } else if (currentPage === 2) {
        const symptom = document.getElementById("symptom").value;
        const details = document.getElementById("details").value.trim();
        if (!symptom || !details) {
          document.getElementById("err-2").style.display = "block";
          return;
        }
      }

      document.getElementById(`page-${currentPage}`).classList.remove("active");
      document.getElementById(`page-${currentPage + 1}`).classList.add("active");

      if (currentPage + 1 === 3) {
        setTimeout(resizeCanvas, 100);
      }
    }

    // --- 최종 의뢰 & 스캔 실행 ---
    async function startInvestigation() {
      if (!hasSignature || !isWaxStamped) {
        document.getElementById("err-3").style.display = "block";
        return;
      }

      document.getElementById("page-3").classList.remove("active");
      document.getElementById("page-4").classList.add("active");

      try {
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        webcam = new tmImage.Webcam(240, 240, true);
        await webcam.setup();
        await webcam.play();

        const box = document.getElementById("webcam-box");
        box.innerHTML = "";
        box.appendChild(webcam.canvas);

        const listContainer = document.getElementById("predictions-list");
        listContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          listContainer.innerHTML += `
            <div class="progress-row">
              <div style="display:flex; justify-content:space-between;">
                <span>${model.getClassLabels()[i]}</span>
                <span id="p-text-${i}">0%</span>
              </div>
              <div class="progress-bar"><div class="progress-fill" id="p-fill-${i}"></div></div>
            </div>`;
        }

        window.requestAnimationFrame(loop);
      } catch (e) {
        alert("카메라 권한을 얻을 수 없거나 모델 로드에 실패했습니다.");
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      let topProb = -1;
      let topClass = "";

      for (let i = 0; i < maxPredictions; i++) {
        const prob = prediction[i].probability;
        const percent = (prob * 100).toFixed(0);

        document.getElementById(`p-fill-${i}`).style.width = percent + "%";
        document.getElementById(`p-text-${i}`).innerText = percent + "%";

        if (prob > topProb) {
          topProb = prob;
          topClass = prediction[i].className;
        }
      }

      document.getElementById("top-verdict").innerText = `${topClass} (${(topProb * 100).toFixed(0)}%)`;
    }
  </script>
</body>
</html>

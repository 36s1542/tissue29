<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>BGM 컨트롤</title>
  <style>
    /* BGM 버튼 스타일 */
    #bgmBtn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background-color: #2c3e50;
      color: #fff;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    #bgmBtn:hover {
      background-color: #34495e;
    }
    /* 유튜브 플레이어 플레이스홀더 (화면에서 숨김) */
    #youtube-player {
      display: none;
    }
  </style>
</head>
<body>

  <!-- BGM 상태 및 조작 버튼 -->
  <button id="bgmBtn" onclick="toggleBGM()">BGM START</button>

  <!-- 유튜브 오디오 플레이어 영역 (비보임) -->
  <div id="youtube-player"></div>

  <!-- 유튜브 IFrame API 로드 -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;
    let isApiReady = false;

    // 유튜브 API가 준비되면 호출되는 함수
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '0',
        width: '0',
        videoId: 'yatKu8DGhRs', // 요청하신 유튜브 영상 ID
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'loop': 1,
          'playlist': 'yatKu8DGhRs' // 반복 재생을 위해 플레이리스트 지정
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    // 플레이어 준비 완료 시
    function onPlayerReady(event) {
      isApiReady = true;
    }

    // 버튼 클릭 시 ON/OFF 토글 함수
    function toggleBGM() {
      const btn = document.getElementById('bgmBtn');

      if (!isApiReady) {
        alert("BGM을 로딩 중입니다. 잠시 후 다시 눌러주세요.");
        return;
      }

      if (!isPlaying) {
        player.playVideo();
        btn.innerText = "BGM ON (OFF 하기)";
        btn.style.backgroundColor = "#27ae60"; // 재생 중엔 초록색
        isPlaying = true;
      } else {
        player.pauseVideo();
        btn.innerText = "BGM OFF (ON 하기)";
        btn.style.backgroundColor = "#e74c3c"; // 정지 중엔 빨간색
        isPlaying = false;
      }
    }
  </script>
</body>
</html>

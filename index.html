<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGM Player</title>
  <style>
    /* 전체 화면 중앙 정렬 및 배경 */
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8f9fa;
    }

    /* BGM 버튼 스타일 */
    .bgm-button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background-color: #2c3e50;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .bgm-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .bgm-button:active {
      transform: translateY(0);
    }

    /* 재생 중 상태 색상 */
    .bgm-button.playing {
      background-color: #27ae60;
    }

    /* 일시정지 상태 색상 */
    .bgm-button.paused {
      background-color: #e74c3c;
    }
  </style>
</head>
<body>

  <!-- BGM 버튼 -->
  <button id="bgmBtn" class="bgm-button" onclick="toggleBgm()">
    <span>▶</span> <span id="btnText">BGM START</span>
  </button>

  <!-- 오디오 태그 (안정성이 검증된 클래식 MP3 음원) -->
  <audio id="bgmAudio" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    브라우저가 오디오 태그를 지원하지 않습니다.
  </audio>

  <script>
    const audio = document.getElementById('bgmAudio');
    const btn = document.getElementById('bgmBtn');
    const btnText = document.getElementById('btnText');

    function toggleBgm() {
      if (audio.paused) {
        // 재생 시도
        audio.play().then(() => {
          btnText.innerText = "BGM ON (클릭시 OFF)";
          btn.className = "bgm-button playing";
        }).catch((error) => {
          console.error("재생 에러:", error);
          alert("오디오를 재생할 수 없습니다. 페이지를 다시 불러와주세요.");
        });
      } else {
        // 일시정지
        audio.pause();
        btnText.innerText = "BGM OFF (클릭시 ON)";
        btn.className = "bgm-button paused";
      }
    }
  </script>
</body>
</html>
